apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-cluster-reader
  namespace: myapp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-telemetry-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
      - events
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-cluster-reader-binding
subjects:
  - kind: ServiceAccount
    name: backend-cluster-reader
    namespace: myapp
roleRef:
  kind: ClusterRole
  name: cluster-telemetry-reader
  apiGroup: rbac.authorization.k8s.io
